<!DOCTYPE html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
        // Normal
        let obj = {
            message : 'Good Job',
            status : 'Complete',
        };
        console.log(obj.message+" "+obj.status);

        // Use de-structuring
        let {message, status} = obj;
        console.log(message+" "+status);

    </script>
</body>
